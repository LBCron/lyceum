# Release on a v* tag: goreleaser builds the four v1 platforms, attaches the
# archives and checksums.txt to the GitHub release and generates the brew cask
# (kept as artifact cask, not pushed); then the npm packages are published
# (platform packages first, the lyceum shim last); then each archive is checked
# on its own platform (AC85), and on darwin the cask is brew-installed from a
# local tap; then the tap job commits the cask to oritromax/homebrew-tap; then
# the release may move its major tag (v1), which
# check-action@v1 resolves to the release it points at: until a stable vN.x.y
# exists vN follows the newest prerelease, from then on only stable releases.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: cask
          path: dist/homebrew/Casks/lyceum.rb
          if-no-files-found: error
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build the npm packages
        run: scripts/npm-packages.sh "$GITHUB_REF_NAME" dist npm-out
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # A prerelease (v1.0.0-rc.1) goes to the next dist-tag, a release to latest.
          case "$GITHUB_REF_NAME" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          for pkg in cli-linux-x64 cli-linux-arm64 cli-darwin-x64 cli-darwin-arm64 lyceum; do
            npm publish "./npm-out/$pkg" --access public --tag "$tag"
          done

  verify:
    needs: release
    permissions:
      contents: read # download the release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04, os: linux, arch: amd64 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { platform: darwin-x64, runner: macos-15-intel, os: darwin, arch: amd64 }
          - { platform: darwin-arm64, runner: macos-15, os: darwin, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    name: verify ${{ matrix.platform }}
    steps:
      - name: Download, check and run the ${{ matrix.platform }} archive
        env:
          GH_TOKEN: ${{ github.token }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          archive="lyceum_${version}_${OS}_${ARCH}.tar.gz"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --pattern checksums.txt
          grep "  $archive\$" checksums.txt | shasum -a 256 -c -
          tar -xzf "$archive" lyceum
          got="$(./lyceum --version)"
          echo "$got"
          test "$got" = "lyceum $version"
      - uses: actions/download-artifact@v7
        if: matrix.os == 'darwin'
        with:
          name: cask
          path: cask
      - name: brew install the cask from a local tap
        if: matrix.os == 'darwin'
        env:
          CASK: cask/lyceum.rb
        run: |
          # Self-contained for a hand run: GITHUB_REF_NAME=v<version> CASK=<path to lyceum.rb>.
          set -eu
          # Update brew first, as a user's brew install does: a runner image's
          # preinstalled Homebrew can predate stanzas goreleaser writes.
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          version="${GITHUB_REF_NAME#v}"
          cask="${CASK:?set CASK to the cask file}"
          brew update
          brew tap-new --no-git lyceumverify/local
          tap="$(brew --repository lyceumverify/local)"
          mkdir -p "$tap/Casks"
          cp "$cask" "$tap/Casks/lyceum.rb"
          brew install --cask lyceumverify/local/lyceum
          bin="$(readlink -f "$(command -v lyceum)")"
          echo "$bin"
          if xattr -p com.apple.quarantine "$bin"; then
            echo "$bin is still quarantined" >&2
            exit 1
          fi
          got="$(lyceum --version)"
          echo "$got"
          test "$got" = "lyceum $version"
          brew uninstall --cask lyceum
          brew untap lyceumverify/local

  tap:
    needs: verify
    runs-on: ubuntu-24.04
    permissions: {} # the push uses HOMEBREW_TAP_TOKEN, not GITHUB_TOKEN
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: cask
          path: cask
      - name: Commit the cask to oritromax/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu
          git clone --depth 1 --branch main \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/oritromax/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp cask/lyceum.rb tap/Casks/lyceum.rb
          cd tap
          git add Casks/lyceum.rb
          if git diff --cached --quiet; then
            echo "Casks/lyceum.rb is unchanged"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "lyceum $GITHUB_REF_NAME"
          git push origin HEAD:main

  major-tag:
    needs: [verify, tap]
    # Every v* tag: the step decides whether this release moves vN.
    runs-on: ubuntu-24.04
    permissions:
      contents: write # move the major tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move the major tag to this release
        run: |
          set -eu
          major="${GITHUB_REF_NAME%%.*}"
          case "$GITHUB_REF_NAME" in
            *-*)
              # A prerelease moves vN only while no stable vN.x.y exists, and only
              # when it is the highest vN.* prerelease by semver precedence
              # (rc.10 > rc.9; same comparison as check-action/run.sh).
              if git tag -l "$major.*.*" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "$GITHUB_REF_NAME is a prerelease and $major has a stable release; $major stays"
                exit 0
              fi
              highest="$(git tag -l "$major.*.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$' | awk '
                function ident(a, b) {
                  if (a ~ /^[0-9]+$/ && b ~ /^[0-9]+$/) return (a + 0 > b + 0) - (a + 0 < b + 0)
                  if (a ~ /^[0-9]+$/) return -1
                  if (b ~ /^[0-9]+$/) return 1
                  return (a > b) - (a < b)
                }
                function cmp(a, b,   pa, pb, ca, cb, xa, xb, na, nb, i, c) {
                  pa = index(a, "-"); pb = index(b, "-")
                  ca = pa ? substr(a, 1, pa - 1) : a; cb = pb ? substr(b, 1, pb - 1) : b
                  split(ca, xa, "."); split(cb, xb, ".")
                  for (i = 1; i <= 3; i++) if ((c = ident(xa[i], xb[i])) != 0) return c
                  if (!pa || !pb) return (!pa) - (!pb)
                  na = split(substr(a, pa + 1), xa, "."); nb = split(substr(b, pb + 1), xb, ".")
                  for (i = 1; i <= na && i <= nb; i++) if ((c = ident(xa[i], xb[i])) != 0) return c
                  return (na > nb) - (na < nb)
                }
                { v = substr($1, 2); if (best == "" || cmp(v, best) > 0) best = v }
                END { if (best != "") print "v" best }')"
              ;;
            *)
              # Only the highest stable vN.x.y moves vN: a patch to an older minor leaves it.
              highest="$(git tag -l "$major.*.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
              ;;
          esac
          if [ "$highest" != "$GITHUB_REF_NAME" ]; then
            echo "$GITHUB_REF_NAME is not the highest $major release ($highest); $major stays"
            exit 0
          fi
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
