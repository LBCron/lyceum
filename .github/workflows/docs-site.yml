# Docs site: build on every pull request that touches it, deploy to Cloudflare Pages when it merges to main.
# lyceum-docs is a direct-upload Pages project, so the deploy is a wrangler upload from CI.
name: docs-site

on:
  pull_request:
    paths: [docs-site/**, .github/workflows/docs-site.yml]
  push:
    branches: [main]
    paths: [docs-site/**, .github/workflows/docs-site.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Sitemap was generated
        run: test -s dist/sitemap-index.xml
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: docs-site-dist
          path: docs-site/dist
          retention-days: 1

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: docs-site-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site-dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Deploy to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the deploy."
            exit 0
          fi
          npx --yes wrangler@4.158.0 pages deploy dist --project-name=lyceum-docs --branch=main --commit-dirty=true
